<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Audio Toolbar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: rgba(25, 25, 25, 0.85);
      border-radius: 12px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      user-select: none;
      -webkit-app-region: drag;
      color: white;
    }

    .audio-toolbar {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 10px;
    }

    .track-info {
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      margin-bottom: 8px;
    }

    .progress-container {
      width: 100%;
      height: 5px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #1db954; /* Spotify green */
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-app-region: no-drag;
    }

    .control-button {
      background: none;
      border: none;
      cursor: pointer;
      margin: 0 12px;
      padding: 8px;
      border-radius: 50%;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .control-button:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .control-button svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .time-display {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.7);
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="audio-toolbar">
    <div class="track-info" id="track-title">Now Playing</div>
    <div class="time-display">
      <span id="current-time">0:00</span>
      <span id="total-time">0:00</span>
    </div>
    <div class="progress-container" id="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="controls">
      <button class="control-button" id="play-pause-btn" title="Play/Pause">
        <svg viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z" id="play-icon" />
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" id="pause-icon" style="display: none;" />
        </svg>
      </button>
      <button class="control-button" id="stop-btn" title="Stop">
        <svg viewBox="0 0 24 24">
          <path d="M6 6h12v12H6z" />
        </svg>
      </button>
      <button class="control-button" id="exit-btn" title="Close">
        <svg viewBox="0 0 24 24">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
        </svg>
      </button>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    
    // DOM elements
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const currentTimeDisplay = document.getElementById('current-time');
    const totalTimeDisplay = document.getElementById('total-time');
    const trackTitle = document.getElementById('track-title');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const stopBtn = document.getElementById('stop-btn');
    const exitBtn = document.getElementById('exit-btn');
    
    // Track state
    let isPlaying = true;
    let duration = 0;
    
    // Format time (seconds) to MM:SS
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }
    
    // Update progress bar
    ipcRenderer.on('update-progress', (event, data) => {
      const { currentTime, duration: newDuration } = data;
      duration = newDuration;
      
      // Update progress bar
      const progressPercent = (currentTime / duration) * 100;
      progressBar.style.width = `${progressPercent}%`;
      
      // Update time displays
      currentTimeDisplay.textContent = formatTime(currentTime);
      totalTimeDisplay.textContent = formatTime(duration);
    });
    
    // Update track info
    ipcRenderer.on('update-track-info', (event, data) => {
      trackTitle.textContent = data.title || 'Now Playing';
    });
    
    // Update play/pause button state
    ipcRenderer.on('playback-state', (event, data) => {
      isPlaying = data.isPlaying;
      updatePlayPauseButton();
    });
    
    function updatePlayPauseButton() {
      if (isPlaying) {
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
      } else {
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    }
    
    // Event listeners
    playPauseBtn.addEventListener('click', () => {
      ipcRenderer.send('audio-toolbar-action', { action: isPlaying ? 'pause' : 'resume' });
      isPlaying = !isPlaying;
      updatePlayPauseButton();
    });
    
    stopBtn.addEventListener('click', () => {
      ipcRenderer.send('audio-toolbar-action', { action: 'stop' });
    });
    
    exitBtn.addEventListener('click', () => {
      ipcRenderer.send('audio-toolbar-action', { action: 'exit' });
    });
    
    progressContainer.addEventListener('click', (e) => {
      const rect = progressContainer.getBoundingClientRect();
      const position = (e.clientX - rect.left) / rect.width;
      ipcRenderer.send('audio-toolbar-action', { 
        action: 'seek', 
        position: position * duration 
      });
    });
  </script>
</body>
</html>
