<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JarvisOS Infobar</title>
    <link rel="stylesheet" href="./infobar.css">
</head>
<body>
    <div id="infobar-container">
        <div id="infobar-header">
            <div class="header-title">JarvisOS Infobar</div>
            <div class="header-controls">
                <!-- Header controls can be added here -->
            </div>
        </div>
        <div id="infobar-content">
            <!-- Dynamic content will be rendered here -->
        </div>
        <div id="infobar-footer">
            <div class="footer-status">Ready</div>
            <div class="footer-actions">
                <!-- Footer actions can be added here -->
            </div>
        </div>
    </div>
    
    <!-- Load page-specific services -->
    <script src="./infobar-renderer.js"></script>
    <!-- Load main page script -->
</body>
</html>
