<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
    <title>Security Verification</title>
    <link rel="stylesheet" href="./password-popup.css">
</head>
<body>
    <div id="password-popup-container">
        <div class="password-popup-header">
            <h2>Security Verification Required</h2>
            <p>Please enter your security password to quit the application</p>
        </div>
        <form id="password-form">
            <input type="password" id="password-input" placeholder="Enter security password..." autocomplete="off" autofocus>
            <div class="button-container">
                <button type="button" id="cancel-button" aria-label="Cancel">
                    <span>Cancel</span>
                </button>
                <button type="submit" id="submit-button" aria-label="Submit">
                    <span>Submit</span>
                </button>
            </div>
        </form>
        <div id="status-message" class="hidden">
            <div class="spinner"></div>
            <span id="status-text">Verifying...</span>
        </div>
    </div>
    <script src="./password-renderer.js"></script>
</body>
</html>
